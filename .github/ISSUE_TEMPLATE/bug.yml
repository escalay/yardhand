name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to show it
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings › Running in the app, or `GET /api/system`.
      placeholder: 0.1.0 · abc1234
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How it runs
      options:
        [
          Docker Compose from a release,
          Docker Compose built from source,
          Another container platform,
          From source (pnpm),
        ]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs gateway`, with keys and addresses you want private removed."
      render: text
