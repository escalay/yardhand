# Static analysis of the TypeScript and of these workflows, on main, on pull requests that touch code or workflows, and weekly for new queries. Code scanning needs a public
# repository on GitHub's free plan, so it runs once the repository is public.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "!**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write # the findings, under Security › Code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
