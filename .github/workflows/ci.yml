# Every change: the gate (lint, types, unit tests), the browser tests against demo gateways, the image built and run
# through the self-hosting path end to end and through an update and a rollback, the Helm chart installed, upgraded
# and rolled back on a cluster, the workflows themselves linted, a
# secrets scan, and on pull requests the title (it becomes the commit, and the changelog) and a review of new
# dependencies.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yardhand/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  self-hosting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: yardhand:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-compose.sh
        env:
          GATEWAY_IMAGE: yardhand:ci
      # Real updates through the updater, with Caddy and HTTPS in front: from every release that can still update in
      # one step, one asked for through the API, and one that fails and must roll back
      - run: scripts/smoke-upgrade.sh
        env:
          GATEWAY_IMAGE: yardhand:ci
          UPGRADE_HTTPS: "1"

  # The Helm chart on a real cluster: the last release installed, upgraded to this image, then a version that dies
  # after migrating and a `helm rollback`, after which the old version must have its data back
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: yardhand:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - run: helm lint deploy/helm/yardhand
      - run: kind create cluster --wait 120s
      - run: scripts/smoke-helm.sh
        env:
          GATEWAY_IMAGE: yardhand:ci

  # actionlint for mistakes, zizmor for the ways a workflow can be turned against its repository
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact --config /repo/.gitleaks.toml

  # A pull request is squashed into one commit named after its title, and releases are cut from those names
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|refactor|chore|test|build|ci|revert)(\([a-z0-9./-]+\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title \"$TITLE\" isn't a Conventional Commit. Write it as type(scope): summary, for example \"fix(web): keep the menu open on a phone\". Types: feat, fix, perf, docs, refactor, chore, test, build, ci, revert."
            exit 1
          fi

  # Dependency review needs a public repository on GitHub's free plan
  dependencies:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the summary it leaves on a pull request that adds a vulnerable dependency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
