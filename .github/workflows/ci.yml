# Every change, tested by what it could break (scripts/ci-plan.sh decides, scripts/ci-plan.test.sh holds it to its
# cases): the gate (lint, types, unit tests) always; the browser tests against demo gateways; the image run through
# the self-hosting path end to end and through an update and a rollback; older releases updated to it; the Helm
# chart installed, upgraded and rolled back on a cluster. Always too: the workflows and the chart linted, a secrets
# scan, and on pull requests the title (it becomes the commit, and the changelog) and a review of new dependencies.
# The workflows, secrets and title jobs are escalay/.github's shared workflows, so their checks are named
# "<job> / <its job>" (workflows / lint, secrets / gitleaks).
# A push to main repeats nothing its pull request already passed on the same commit. Every night everything runs,
# from every release. The release workflow starts this one for a release's pull request, which the bot opens and
# which therefore starts nothing by itself; its last job then sets the required checks as commit statuses, the only
# kind GitHub counts for a pull request from a dispatched run.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run needs (scripts/ci-plan.sh), and which older releases the upgrade test starts from
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # the files a pull request changes
      checks: read # whether this commit already passed in its pull request
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      compose: ${{ steps.plan.outputs.compose }}
      kubernetes: ${{ steps.plan.outputs.kubernetes }}
      older: ${{ steps.releases.outputs.older }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tested=false
          if [ "$EVENT" = push ]; then
            # The slow jobs of an earlier run on this very commit: passed, or skipped as not needed
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate \
              --jq '.check_runs[] | select(.conclusion == "success" or .conclusion == "skipped") | .name' \
              | grep -xE 'gate|e2e|self-hosting|kubernetes' | sort -u | wc -l)
            [ "$passed" -lt 4 ] || tested=true
          fi
          files=
          if [ -n "$NUMBER" ]; then
            # Each file, and whether its change adds a migration or a table
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --paginate --jq '.[] | [.filename,
              ((.patch // "") | test("(^|\\n)\\+[^\\n]*(migrations|(create|alter|drop) +(table|index))"; "i"))] | @tsv')
          fi
          printf '%s\n' "$files" | TESTED="$tested" scripts/ci-plan.sh | tee -a "$GITHUB_OUTPUT"
      - id: releases
        env:
          WHICH: ${{ steps.plan.outputs.older }}
        run: |
          least=$(jq -r .upgradeFrom deploy/release.json)
          published=$(git ls-remote --tags --refs https://github.com/escalay/yardhand.git 'v*' | sed 's|.*refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          last=$(echo "$published" | tail -n 1)
          # Older than the last one, which the self-hosting job starts from, and still able to update in one step
          older=$(echo "$published" | awk -v least="$least" -v last="$last" '
            function key(v, p) { split(v, p, "."); return p[1] * 1000000 + p[2] * 1000 + p[3] }
            key($0) >= key(least) && key($0) < key(last)')
          case "$WHICH" in
            none) older= ;;
            # The oldest and the newest of them: the longest jump and the most likely one
            some) older=$(printf '%s\n' "$older" | sed -n '1p;$p' | sort -uV) ;;
          esac
          echo "older=$(printf '%s' "$older" | jq -R . | jq -sc 'map(select(length > 0))')" | tee -a "$GITHUB_OUTPUT"

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  e2e:
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs, by the Playwright version that asks for it; its system packages are not
      - id: playwright
        run: echo "version=$(pnpm --filter @yardhand/web exec playwright --version | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter @yardhand/web exec playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm --filter @yardhand/web exec playwright install-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  self-hosting:
    needs: plan
    if: needs.plan.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: yardhand:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-compose.sh
        env:
          GATEWAY_IMAGE: yardhand:ci
      # Real updates through the updater, with Caddy and HTTPS in front: from the last release, one asked for through
      # the API, and one that fails and must roll back. The older releases each get a job of their own below
      - run: scripts/smoke-upgrade.sh
        env:
          GATEWAY_IMAGE: yardhand:ci
          UPGRADE_HTTPS: "1"
          UPGRADE_OLDER: skip

  # Every older release that can still update in one step, with data in it, updated to this image
  upgrade-from:
    needs: plan
    if: needs.plan.outputs.older != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.older) }}
    name: upgrade from ${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: yardhand:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - run: scripts/smoke-upgrade.sh
        env:
          GATEWAY_IMAGE: yardhand:ci
          UPGRADE_HTTPS: "1"
          UPGRADE_FROM: ${{ matrix.release }}
          UPGRADE_LEGS: first

  # The Helm chart on a real cluster: the last release installed, upgraded to this image, then a version that dies
  # after migrating and a `helm rollback`, after which the old version must have its data back
  kubernetes:
    needs: plan
    if: needs.plan.outputs.kubernetes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          load: true
          tags: yardhand:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - run: kind create cluster --wait 120s
      - run: scripts/smoke-helm.sh
        env:
          GATEWAY_IMAGE: yardhand:ci

  # actionlint for mistakes, zizmor for the ways a workflow can be turned against its repository
  workflows:
    uses: escalay/.github/.github/workflows/workflows.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1

  # What never needs a slow job: the map of what runs for which change, and the chart's lint and numbers
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What runs for which change
        run: scripts/ci-plan.test.sh
      - run: helm lint deploy/helm/yardhand
      - name: The chart installs the version it is numbered as, and that is this tree's
        run: |
          chart=$(helm show chart deploy/helm/yardhand)
          version=$(echo "$chart" | sed -n 's/^version: //p' | tr -d '"')
          app=$(echo "$chart" | sed -n 's/^appVersion: //p' | tr -d '"')
          tree=$(jq -r '."."' .release-please-manifest.json)
          if [ "$version" != "$tree" ] || [ "$app" != "$tree" ]; then
            echo "::error::the chart is numbered $version and installs $app, but this tree is $tree"; exit 1
          fi

  # gitleaks over the whole history, with .gitleaks.toml
  secrets:
    uses: escalay/.github/.github/workflows/secrets.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1

  # A pull request is squashed into one commit named after its title, and releases are cut from those names
  title:
    if: github.event_name == 'pull_request'
    uses: escalay/.github/.github/workflows/title.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1

  # Dependency review needs a public repository on GitHub's free plan
  dependencies:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the summary it leaves on a pull request that adds a vulnerable dependency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # A run started by a dispatch (release.yml starts one for the release pull request) reports its checks on the commit,
  # but GitHub does not count them for a pull request, so the branch rules would wait forever. Commit statuses do count:
  # once no job failed (a job the plan skipped is fine, as it is for a pull request), each check the rules for main
  # require is set as one, by the names the rules hold at that moment
  dispatched:
    needs: [plan, gate, e2e, self-hosting, upgrade-from, kubernetes, workflows, tooling, secrets]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      statuses: write
    uses: escalay/.github/.github/workflows/required-statuses.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1
